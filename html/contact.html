<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Me | My Digital Portfolio</title>
    <link rel="icon" href="data:," />

    <!-- Connect CSS -->
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <!-- Navigation -->
    <div class="topnav">
      <a href="index.html">Home</a>
      <a href="about.html">About Me</a>
      <a class="active" href="contact.html">Contact</a>
    </div>

    <main class="innerbody">
      <h1>Contact Me</h1>

      <div class="profile-section">
        <h2>Get in Touch</h2>

        <p>
          Thank you for visiting my digital portfolio! If you would like to get
          in touch, please fill out the contact form below.
        </p>
      </div>

      <!-- Contact Form -->
      <form id="contactForm" class="contact-form">
        <label for="contactName">Your Name:</label>
        <input
          type="text"
          id="contactName"
          placeholder="Enter your name"
          required
        />

        <label for="contactEmail">Your Email:</label>
        <input
          type="email"
          id="contactEmail"
          placeholder="Enter your email"
          required
        />

        <label for="contactMessage">Your Message:</label>
        <textarea
          id="contactMessage"
          placeholder="Write your message here..."
          required
        ></textarea>

        <button type="submit">Send Message</button>

        <div id="contactOutput"></div>
      </form>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="row">
        <a href="index.html">Return Home</a>
      </div>

      <div class="row">
        Copyright © 2026 My Digital Portfolio - All rights reserved | Designed
        By: Kyle H
      </div>
    </footer>

    <!-- Connect JavaScript -->
    <script type="module" src="../js/contact.js"></script>
  </body>
</html>
